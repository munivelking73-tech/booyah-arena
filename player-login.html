<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BOOYAH ARENA — Player Access</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800;900&family=DM+Sans:wght@400;600;700;800&display=swap" rel="stylesheet"><style>:root{--bg:#080a10;--panel:#111722;--line:#263044;--muted:#8e9ab1;--orange:#ff6b1a;--cyan:#29d6ff;--red:#ff7a80}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 80% 10%,rgba(255,107,26,.16),transparent 32%),var(--bg);color:#fff;font-family:'DM Sans',sans-serif}.wrap{width:min(560px,92vw);margin:40px auto}.brand{font:900 40px 'Barlow Condensed';letter-spacing:.04em;text-align:center}.brand span{color:var(--orange)}.sub{text-align:center;color:var(--muted);font-size:12px;margin:5px 0 22px}.box{background:rgba(17,23,34,.96);border:1px solid var(--line);padding:26px;box-shadow:0 18px 50px rgba(0,0,0,.3)}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:20px}.tabs button{border:1px solid var(--line);background:#182033;color:#fff;padding:12px;font-weight:800;cursor:pointer}.tabs button.active{background:var(--orange);border-color:var(--orange)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{margin:12px 0}.field label{display:block;color:#b4bfd2;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px}.field input{width:100%;padding:13px;background:#0b0f17;border:1px solid var(--line);color:#fff;outline:none}.field input:focus{border-color:var(--cyan)}.pass{display:flex;gap:6px}.pass input{flex:1}.show{background:#202a3d;color:#fff;border:1px solid var(--line);padding:0 12px;cursor:pointer}.submit{width:100%;margin-top:12px;padding:14px;border:0;background:var(--orange);color:#fff;font-weight:900;cursor:pointer}.links{display:flex;justify-content:space-between;gap:10px;margin-top:14px}.link{background:none;border:0;color:var(--cyan);padding:0;cursor:pointer}.back{display:block;color:var(--muted);text-decoration:none;text-align:center;margin-top:18px;font-size:12px}.err{color:var(--red);min-height:20px;margin-top:10px;font-size:12px}.hint{font-size:11px;color:var(--muted);line-height:1.5;background:#0b0f17;border:1px solid var(--line);padding:11px;margin-top:14px}.hidden{display:none!important}@media(max-width:520px){.grid{grid-template-columns:1fr}.wrap{margin:20px auto}.box{padding:20px}.brand{font-size:34px}}</style></head><body><main class="wrap"><div class="brand">BOOYAH <span>ARENA</span></div><p class="sub">FREE FIRE TOURNAMENT PLAYER ACCESS</p><section class="box"><div class="tabs"><button id="loginTab" class="active" onclick="showMode('login')">LOGIN</button><button id="registerTab" onclick="showMode('register')">CREATE ACCOUNT</button></div><form id="authForm"><div id="registerFields" class="hidden"><div class="grid"><div class="field"><label>Free Fire username</label><input id="username" autocomplete="nickname"></div><div class="field"><label>Free Fire UID</label><input id="uid" inputmode="numeric" maxlength="10" placeholder="10 digits"></div></div><div class="grid"><div class="field"><label>Gmail</label><input id="email" type="email" placeholder="you@gmail.com" autocomplete="email"></div><div class="field"><label>Phone no</label><input id="phone" inputmode="numeric" maxlength="10" placeholder="10-digit mobile"></div></div></div><div id="loginIdentity" class="field"><label>Free Fire username / Gmail / phone</label><input id="identity" autocomplete="username" required></div><div class="field"><label>Password</label><div class="pass"><input id="password" type="password" autocomplete="current-password" required><button type="button" class="show" onclick="toggle('password',this)">SHOW</button></div></div><div id="confirmWrap" class="field hidden"><label>Confirm password</label><div class="pass"><input id="confirm" type="password"><button type="button" class="show" onclick="toggle('confirm',this)">SHOW</button></div></div><div id="registerHint" class="hint hidden">Create your account with your Free Fire username, UID, Gmail and phone number. Your wallet starts at 0 points.</div><button id="submit" class="submit">LOGIN</button><div id="err" class="err"></div></form><div class="links"><button class="link" onclick="location.href='index.html'">Tournament home</button></div></section><a class="back" href="index.html">← Back to BOOYAH ARENA</a></main><script>let mode='login';function toggle(id,b){const x=document.getElementById(id);x.type=x.type==='password'?'text':'password';b.textContent=x.type==='password'?'SHOW':'HIDE'}function showMode(x){mode=x;document.getElementById('loginTab').classList.toggle('active',x==='login');document.getElementById('registerTab').classList.toggle('active',x==='register');document.getElementById('registerFields').classList.toggle('hidden',x!=='register');document.getElementById('confirmWrap').classList.toggle('hidden',x!=='register');document.getElementById('registerHint').classList.toggle('hidden',x!=='register');document.getElementById('loginIdentity').classList.toggle('hidden',x==='register');document.getElementById('submit').textContent=x==='register'?'CREATE ACCOUNT':'LOGIN';document.getElementById('err').textContent=''}document.getElementById('authForm').addEventListener('submit',async e=>{e.preventDefault();const err=document.getElementById('err'),btn=document.getElementById('submit');err.textContent='';btn.disabled=true;try{let body;if(mode==='register'){const username=document.getElementById('username').value.trim(),uid=document.getElementById('uid').value.trim(),email=document.getElementById('email').value.trim(),phone=document.getElementById('phone').value.trim(),password=document.getElementById('password').value,confirm=document.getElementById('confirm').value;if(!username||!uid||!email||!phone||!password||!confirm)throw Error('Fill all account fields.');if(!/^\d{10}$/.test(uid))throw Error('Free Fire UID must be exactly 10 digits.');if(!/^\d{10}$/.test(phone))throw Error('Phone number must be exactly 10 digits.');if(!email.toLowerCase().endsWith('@gmail.com'))throw Error('Please use a Gmail address.');if(password.length<6)throw Error('Password must be at least 6 characters.');if(password!==confirm)throw Error('Passwords do not match.');body={username,name:username,email,phone,uid,password};}else{const identity=document.getElementById('identity').value.trim(),password=document.getElementById('password').value;if(!identity||!password)throw Error('Enter your username/Gmail/phone and password.');body={identity,password}}const r=await fetch(mode==='register'?'/api/register':'/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const d=await r.json();if(!r.ok)throw Error(d.error||'Request failed');localStorage.setItem('booyahToken',d.token);localStorage.setItem('booyahPlayer',JSON.stringify(d.player||{}));location.href='player-dashboard.html';}catch(e){err.textContent=e.message}finally{btn.disabled=false;btn.textContent=mode==='register'?'CREATE ACCOUNT':'LOGIN'}});</script></body></html>
