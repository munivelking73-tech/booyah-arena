<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BOOYAH ARENA — Player Login</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#090b12;color:#edf2ff;font:14px Arial}.box{width:min(420px,90vw);background:#121722;border:1px solid #333;padding:30px}h1{font-size:42px}span{color:#ff6b1a}label{display:block;color:#97a1b8;font-size:12px;margin:13px 0}input{width:100%;box-sizing:border-box;padding:12px;background:#0c0f16;border:1px solid #333;color:#fff}.tabs{display:flex;gap:8px}.tabs button{flex:1;padding:11px;background:#242b3b;color:#fff;border:0}.tabs .active,button.submit{background:#ff6b1a}.submit{width:100%;padding:13px;color:#fff;border:0;margin-top:12px;font-weight:bold}.err{color:#ff7a80;min-height:20px;margin-top:10px}.back{display:block;color:#29d6ff;margin-top:18px}</style></head><body><main class="box"><h1>BOOYAH <span>ARENA</span></h1><div class="tabs"><button id="lt" class="active" onclick="mode('login')">LOGIN</button><button id="rt" onclick="mode('register')">CREATE ACCOUNT</button></div><form id="loginForm" autocomplete="on"><div id="reg" style="display:none"><label>Player name<input id="name"></label><label>Email<input id="email" type="email"></label><label>Free Fire UID<input id="uid" inputmode="numeric" pattern="[0-9]{10}" minlength="10" maxlength="10" title="Free Fire UID must be exactly 10 digits" required></label></div><label>Username<input id="identity" autocomplete="username" required></label><label>Password<div style="display:flex;gap:6px"><input id="password" type="password" autocomplete="current-password" required style="flex:1"><button type="button" id="togglePass" style="padding:0 12px;background:#252c3c;color:#fff;border:0;cursor:pointer" onclick="togglePassword()">SHOW</button></div></label><label id="refLabel" style="display:none">Referral code (optional)<input id="referralCode" placeholder="BOOYAH-XXXXXXXX" autocomplete="off"></label><label id="cl" style="display:none">Confirm password<input id="confirm" type="password"></label><button type="submit" class="submit" id="sub" onclick="submitForm(event)">LOGIN</button><div class="err" id="err"></div></form><a class="back" href="index.html">← Tournament website</a><a class="back" href="https://chat.whatsapp.com/CsmvEFNvAFI5DjpwfXob0f" target="_blank" rel="noopener">Customer Support on WhatsApp</a></main><script>
let m='login'; let submitting=false;
function togglePassword(){const p=document.getElementById('password'),b=document.getElementById('togglePass');p.type=p.type==='password'?'text':'password';b.textContent=p.type==='password'?'SHOW':'HIDE'}
function mode(x){m=x;document.getElementById('lt').classList.toggle('active',x==='login');document.getElementById('rt').classList.toggle('active',x==='register');document.getElementById('reg').style.display=x==='register'?'block':'none';document.getElementById('cl').style.display=x==='register'?'block':'none';document.getElementById('refLabel').style.display=x==='register'?'block':'none';document.getElementById('sub').textContent=x==='login'?'LOGIN':'CREATE ACCOUNT';document.getElementById('err').textContent=''}
document.getElementById('loginForm').addEventListener('submit', submitForm);
async function submitForm(e){
 e.preventDefault();
 if(submitting)return;
 submitting=true;
 const errEl=document.getElementById('err'), sub=document.getElementById('sub');
 errEl.textContent=''; sub.disabled=true; sub.textContent=m==='login'?'LOGGING IN...':'CREATING...';
 const identity=document.getElementById('identity').value.trim(); const password=document.getElementById('password').value;
 try{
  if(!identity||!password) throw Error('Enter your username/email and password.');
  let url='/api/login', body={identity,password};
  if(m==='register'){
   const name=document.getElementById('name').value.trim(), email=document.getElementById('email').value.trim(), uid=document.getElementById('uid').value.trim(), confirm=document.getElementById('confirm').value;
   if(!name||!email||!identity||!uid||!password||!confirm) throw Error('Please fill in all account fields.');
   if(!/^[0-9]{10}$/.test(uid)) throw Error('Free Fire UID must be exactly 10 digits.');
   if(password.length<6) throw Error('Password must be at least 6 characters.');
   if(password!==confirm) throw Error('Passwords do not match.');
   url='/api/register'; body={username:identity,name,email,uid,password,referral_code:document.getElementById('referralCode').value.trim()};
  }
  const controller=new AbortController(); const timer=setTimeout(()=>controller.abort(),10000);
  const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body),signal:controller.signal}); clearTimeout(timer);
  const text=await r.text(); let d={}; try{d=JSON.parse(text)}catch(_){throw Error('Server returned an invalid response. Make sure Start-BOOYAH.bat is running.')}
  if(!r.ok) throw Error(d.error||('Server error '+r.status));
  if(!d.token) throw Error('Login succeeded but no session token was returned. Restart Start-BOOYAH.bat and try again.');
  localStorage.setItem('booyahToken',d.token); localStorage.setItem('booyahPlayer',JSON.stringify(d.player||{}));
  window.location.replace('/player-dashboard.html');
 }catch(x){submitting=false;errEl.textContent=x.name==='AbortError'?'Server did not respond within 10 seconds. Make sure Start-BOOYAH.bat is running.':x.message; sub.disabled=false; sub.textContent=m==='login'?'LOGIN':'CREATE ACCOUNT'}
}
</script></body></html>
