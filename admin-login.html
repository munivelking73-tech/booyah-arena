<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BOOYAH ARENA — Admin Login</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#090b12;color:#edf2ff;font:14px Arial}.box{width:360px;background:#121722;border:1px solid #333;padding:28px}h1{margin:0 0 20px}span{color:#ff6b1a}label{display:block;color:#97a1b8;font-size:12px;margin:13px 0}input{width:100%;padding:12px;box-sizing:border-box;background:#0c0f16;border:1px solid #333;color:white}button{width:100%;padding:13px;background:#ff6b1a;color:white;border:0;font-weight:bold;margin-top:14px}.err{color:#ff7a80;min-height:20px;margin-top:10px}.back{display:block;color:#29d6ff;margin-top:16px}</style></head><body><main class="box"><h1>BOOYAH <span>ADMIN</span></h1><label>Username<input id="u"></label><label>Password<input id="p" type="password"></label><button onclick="login()">LOGIN TO ADMIN</button><div class="err" id="e"></div><a class="back" href="index.html">← Player website</a><a class="back" href="https://chat.whatsapp.com/CsmvEFNvAFI5DjpwfXob0f" target="_blank" rel="noopener">Customer Support on WhatsApp</a></main><script>async function login(){e.textContent='';let r=await fetch('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:u.value,password:p.value})}),d=await r.json();if(!r.ok){e.textContent=d.error;return}sessionStorage.setItem('booyahAdminToken',d.token);location='admin.html'}</script></body></html>
